# OpenLedger monorepo workspace (working repo name: openerp).
# NOTE: no Rust toolchain was installed when this was scaffolded (2026-05-29);
# dependency versions/features are conservative but UNVERIFIED by a real build.
# Stage 1 first step: install Rust, then `cargo build` and reconcile versions.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Philippe Hermann <phil.hermann217@gmail.com>"]
repository = "https://github.com/Pher217/openerp"

[workspace.dependencies]
# Async + web
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
# DB: SQLx for the hot ledger path (ADR-004/005); SeaORM 1.1.x for CRUD (NOT 2.0 — still RC).
# Pinned to 0.8 to match the sqlx that SeaORM 1.1.x depends on — avoids two sqlx copies.
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "macros", "migrate", "json"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
# MCP server (rmcp 1.7.x): stdio + Streamable HTTP
rmcp = { version = "1", features = ["server", "macros", "transport-streamable-http-server"] }
# Serde + ids + errors + time + logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# ol-auth: OAuth 2.1 AS crypto/token core
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
