# Packaging wrapper: keep project licensing outside generator-owned files.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coolerp-sdk"
version = "0.1.0.dev0"
description = "Local prototype of a Tungsten-generated CoolERP Python SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["tungsten-runtime>=0.1.4,<0.2.0", "pydantic>=2.10,<3", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["build/validated/coolerp_sdk"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"build/validated/coolerp_sdk" = "coolerp_sdk"

[tool.pytest.ini_options]
testpaths = ["tests"]
