name: Python SDK

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sdk_test
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: sdk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdk_test -d sdk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sdk_test:disposable_only@localhost:5432/sdk_test
      PGPASSWORD: disposable_only
      BIND_ADDR: 127.0.0.1:38660
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply disposable database migrations
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U sdk_test -d sdk_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Check the actual OpenAPI contract
        run: |
          cargo run --locked -p ol-api --example export_openapi > /tmp/openapi.json
          python -c "import json; assert json.load(open('/tmp/openapi.json')) == json.load(open('sdk/python/openapi.json'))"
      - name: Build wheel from source distribution
        run: |
          python -m pip install build
          python -m build sdk/python --outdir /tmp/sdk-dist
      - name: Install wheel and public runtime into a fresh environment
        run: |
          python -m venv /tmp/sdk-test
          /tmp/sdk-test/bin/python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple -c sdk/python/constraints-py312.txt /tmp/sdk-dist/*.whl pytest
          /tmp/sdk-test/bin/python -m pip check
      - name: Test installed SDK against disposable PostgreSQL 17
        run: |
          cargo build --locked -p ol-api --bin ol-api
          target/debug/ol-api > /tmp/sdk-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:38660/api-docs/openapi.json > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/sdk-api.log; exit 1; fi
          COOLERP_DISPOSABLE_TEST=1 /tmp/sdk-test/bin/python -I -m pytest sdk/python/tests -q
