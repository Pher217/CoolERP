# Local dev dependency: PostgreSQL only. The Rust services and the web UI run on
# the host via `cargo run` / `npm run dev` (see the Makefile and README quickstart).
# This keeps the "5-minute clone-to-running" path fast and hard to break.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: coolerp
      POSTGRES_PASSWORD: coolerp
      POSTGRES_DB: coolerp
    ports:
      # Override the host port with OL_DB_PORT if 5432 is taken locally.
      - "${OL_DB_PORT:-5432}:5432"
    volumes:
      - coolerp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolerp -d coolerp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  coolerp_pgdata:
