[package]
name = "ol-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure crypto/token core for the OpenERP OAuth 2.1 Authorization Server."

[dependencies]
jsonwebtoken.workspace = true
ed25519-dalek.workspace = true
argon2.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# Re-export LineEnding for PEM generation; version must match what ed25519-dalek pulls in.
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
