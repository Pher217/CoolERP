[package]
name = "ol-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure crypto/token core for the CoolERP OAuth 2.1 Authorization Server."

[dependencies]
jsonwebtoken.workspace = true
ed25519-dalek.workspace = true
argon2.workspace = true
base64.workspace = true
# argon2/password-hash 0.5 takes rand_core 0.6's CryptoRngCore, a different generation from
# the rand_core 0.10 that ed25519-dalek 3 uses. Each call site gets the RNG its crate expects.
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# Re-export LineEnding for PEM generation; version must match what ed25519-dalek pulls in.
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
